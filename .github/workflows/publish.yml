name: Publish Godot Web Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quick-preview.html'
      - '.github/workflows/publish.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public preview assets
        uses: actions/checkout@v4
        with:
          path: preview
      - name: Check source token
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.GODOT_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Set GODOT_SOURCE_READ_TOKEN in repository Actions secrets."
            exit 1
          fi
      - name: Checkout private Godot source
        uses: actions/checkout@v4
        with:
          repository: roshanexx/Godot-Engine-
          ref: main
          token: ${{ secrets.GODOT_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Install Godot 4.6
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q Godot_v4.6-stable_linux.x86_64.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip -q Godot_v4.6-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/4.6.stable/"
      - name: Export Web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ./Godot_v4.6-stable_linux.x86_64 --headless --path source --import --quit
          ./Godot_v4.6-stable_linux.x86_64 --headless --path source --export-release Web "$GITHUB_WORKSPACE/dist/index.html"
          test -s dist/index.html
          touch dist/.nojekyll
      - name: Include lightweight HTML5 preview
        shell: bash
        run: |
          mkdir -p dist/quick
          cp preview/quick-preview.html dist/quick/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web files only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
